# Kern — your working copy, running in the containers.
#
# Named `compose.dev.yaml`, not `compose.override.yaml`. That was a magic filename compose loads by
# itself, and the magic stopped applying the moment COMPOSE_FILE became how an installation chooses
# its services: setting that variable suppresses the automatic override entirely. A name promising
# behaviour it no longer has is worse than no convention, and this was the only development file not
# called `.dev`. Now the production rule is one sentence: a production COMPOSE_FILE contains no
# `.dev` file. See docs/INSTALLER-PLAN.md §3.
#
# Must be listed last, after every base file it modifies.
#
# It holds the development half for services that are always present: the edge, the four PHP
# processes, and mailpit, which is dev-only in its entirety. The development half of a service an
# installation might not run at all lives beside its base file instead —
# compose.services/postgres.dev.yaml, redis.dev.yaml, python.dev.yaml — because a file naming a
# service whose base file was left out declares a service with no image and invalidates the whole
# project.
#
# What all of it amounts to: the containers run the source on this host instead of the code baked
# into the image, and are writable so they can. None of that belongs on a server — see
# compose.yaml's own header.
#
# Why it needs a non-internal `dev_net`:
#   - Publishes postgres/redis to the host for local psql/redis-cli
#     access ("dev access goes through the app or an explicit override" —
#     this is that override). compose.yaml deliberately keeps those three on
#     `data_net` only (internal: true, no outbound Internet); a container
#     already on an internal network cannot have its ports published to the
#     host (confirmed by a real test 2026-09-07 — publishing a port on a
#     container with only an internal-network attachment is unreachable).
#     Attaching them here, in dev only, to a second, non-internal network
#     restores publishing. This is a deliberate hardening tradeoff scoped to
#     local development; it must never ship to a production compose file.
#   - Adds mailpit (SMTP catch-all + web UI), dev-only per BLUEPRINT.md §3.1.
#   - Runs the four Laravel processes and the two Python processes with the
#     real host source bind-mounted over the built image, so code edits are
#     visible without a rebuild. This necessarily drops `read_only` for
#     those services — dev convenience, not the production shape.

networks:
  dev_net:
    driver: bridge

services:
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    networks:
      - app_net
      - dev_net
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  # Note on volumes: compose.yaml's `app_storage`/`app_bootstrap_cache` named
  # volumes are still declared on the base service and Compose *concatenates*
  # volume lists across files rather than replacing them — so they stay
  # mounted here too, layered on top of the bind mount below at their own
  # subpaths (`/var/www/html/storage`, `/var/www/html/bootstrap/cache`).
  # That's harmless (Docker mounts the more specific path last regardless of
  # declaration order) but means dev storage/logs live in those named
  # volumes, not directly in the bind-mounted apps/api/storage on the host —
  # `make shell` + `docker compose logs app` is the way to see them, not
  # `tail -f apps/api/storage/logs/laravel.log` from the host.
  edge:
    # Serve the CURRENT built assets, not the snapshot baked in at image-build time.
    # docker/caddy/Dockerfile COPYs apps/api/public, so every `npm run build` changes the asset
    # hashes while the edge keeps serving the old ones — the site 404s its own CSS and JS until
    # someone rebuilds the edge image. Production keeps the baked-in copy (immutable deploys);
    # development mounts the live directory so a rebuild is enough.
    volumes:
      - ./apps/api/public:/var/www/html/public:ro
      # Same reasoning for the server config: docker/caddy/Dockerfile COPYs the Caddyfile, so an
      # edit to it does nothing until the image is rebuilt — a route can look present in the
      # repository and be absent from the running server, which is exactly how the Reverb proxy
      # first appeared to 404. `make reload` restarts the container and the edit is live.
      # Production keeps the baked-in copy.
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  # Every PHP service below mounts `docker/php/php.dev.ini` into `conf.d`, which turns opcache's
  # timestamp validation back on. Without it php-fpm serves the compiled copy it made at startup and
  # ignores the bind-mounted source entirely, so every PHP or config edit needs a container recreate
  # before the browser sees it. Production is unaffected — the file is mounted here, never baked
  # into an image. See that file's header for the full explanation.
  # Mail goes to Mailpit, in all three of the processes that send it — the queue sends every queued
  # notification, including the email-verification code. Not to the log, which is where `.env`'s
  # `MAIL_MAILER=log` would put it: in full, readable by anyone who can read the log, and delivered to
  # nobody. Open http://localhost:8025 to read it.
  app:
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./apps/api:/var/www/html
      # The local packages, where composer's symlink from vendor/kern/* points once the
      # application root is /var/www/html. Path repositories are how a package is developed in the
      # same tree as the application that uses it; a published one arrives in vendor/ like any other.
      - ./packages:/var/packages
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    read_only: false
    ports:
      - "${VITE_DEV_PORT:-5173}:5173"

  # The migrations on this host, not the copy baked into the image — the same reason as the services
  # around it. Without this, `make migrate` would apply whatever migrations the image was built with.
  migrate:
    volumes:
      - ./apps/api:/var/www/html
      - ./packages:/var/packages
    read_only: false

  queue:
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./apps/api:/var/www/html
      # The local packages, where composer's symlink from vendor/kern/* points once the
      # application root is /var/www/html. Path repositories are how a package is developed in the
      # same tree as the application that uses it; a published one arrives in vendor/ like any other.
      - ./packages:/var/packages
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    read_only: false

  scheduler:
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./apps/api:/var/www/html
      # The local packages, where composer's symlink from vendor/kern/* points once the
      # application root is /var/www/html. Path repositories are how a package is developed in the
      # same tree as the application that uses it; a published one arrives in vendor/ like any other.
      - ./packages:/var/packages
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    read_only: false

  reverb:
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    volumes:
      - ./apps/api:/var/www/html
      # The local packages, where composer's symlink from vendor/kern/* points once the
      # application root is /var/www/html. Path repositories are how a package is developed in the
      # same tree as the application that uses it; a published one arrives in vendor/ like any other.
      - ./packages:/var/packages
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    read_only: false
