<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <title>Offline — Kern</title>
        <!-- Styles and script are files, not inline: the page must work under the same
             Content-Security-Policy as the application. The service worker caches all three. -->
        <link rel="stylesheet" href="/offline.css" />
        <script src="/offline.js" defer></script>
    </head>
    <body>
        <div class="backdrop" aria-hidden="true">
            <span class="grid"></span>
            <span class="bloom"></span>
        </div>

        <main>
            <div class="mark" aria-hidden="true">
                <span class="ring"></span>
                <span class="ring ring-2"></span>
                <span class="ring ring-3"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h.01" />
                    <path d="M8.5 16.4a5 5 0 0 1 7 0" />
                    <path d="M5 12.9a10 10 0 0 1 5.2-2.7" />
                    <path d="M19 12.9a10 10 0 0 0-2.1-1.6" />
                    <path d="M2 8.8a15 15 0 0 1 4.2-2.6" />
                    <path d="M22 8.8A15 15 0 0 0 10.7 4.5" />
                    <path d="m2 2 20 20" />
                </svg>
            </div>

            <h1 data-text="title">You are offline</h1>
            <p data-text="body">
                This page could not load because the device has no connection. Documents already in the upload queue stay on
                this device and upload by themselves once the internet is back.
            </p>

            <button type="button" id="retry" data-text="retry">Try again</button>

            <p class="status" role="status">
                <span class="dot" aria-hidden="true"></span>
                <span data-text="waiting">Waiting for the connection…</span>
            </p>
        </main>
    </body>
</html>
