worker_processes auto;

# No `user` directive: the container process already runs as the non-root
# `nginx` user (Dockerfile USER nginx); nginx would otherwise warn that the
# directive is meaningless when it isn't started as root.
pid /var/run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Read-only root filesystem (compose.yaml): both paths below are tmpfs
    # mounts, not disk.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;

    log_format main '$remote_addr - $request_id [$time_iso8601] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

    # stdout/stderr only — container logs are the collection point
    # (BLUEPRINT.md §23). Never log request bodies (docs/AGENTS.md §1.12).
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Document capture uploads (BLUEPRINT.md §1.4) — outer ceiling only, the
    # same 25M enforced in docker/php/php.ini upload_max_filesize.
    client_max_body_size 25m;

    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
