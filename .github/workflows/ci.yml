# TaxOS România — CI pipeline (BLUEPRINT.md §22, docs/AGENTS.md §7).
#
# One workflow file, not several, because the fail-fast ordering this
# blueprint asks for ("cheap lanes before expensive ones") is expressed with
# `needs:` — and `needs:` only works between jobs in the *same* workflow
# file. Splitting this into per-stack files would silently drop that
# ordering guarantee.
#
# Job map:
#   secret-scan      — gitleaks over the git-tracked tree. No `needs`: cheap,
#                       runs immediately.
#   fiscal-gates      — placeholder for BLUEPRINT.md §22's fiscal-change gates
#                       (Milestone 4/5 not built yet). No `needs`: cheap,
#                       runs immediately. See .github/scripts/fiscal-gates-
#                       placeholder.sh for exactly what is and isn't real.
#   php-quality       — composer validate/audit, Pint, PHPStan, Deptrac. No
#                       database needed. No `needs`.
#   php-tests         — Pest against real Postgres + Redis service
#                       containers. `needs: php-quality` — do not spend a
#                       database + full test run on a change that doesn't
#                       even pass static analysis.
#   package-suites    — every `packages/*` suite, each with its own
#                       `composer install` and its own Laravel. `needs:
#                       php-quality`, same reasoning as php-tests. This is
#                       the lane that answers "is each package installable
#                       on its own", which php-tests structurally cannot:
#                       it runs against an application where every package
#                       happens to be present (docs/adr/0016, Stage 2).
#   js-api            — apps/api's Inertia/React frontend: lint, format,
#                       typecheck, build, audit. No `needs`. Uploads the
#                       Vite build as an artifact for the `containers` job.
#   js-browser-worker — apps/browser-worker: lint, typecheck, build, real tests,
#                       audit, inside the Playwright image (the tests start
#                       Chromium). No `needs`.
#   python            — apps/processing: uv/ruff/pyright/pytest/pip-audit.
#                       No `needs`.
#   containers        — builds every production image, generates an SBOM,
#                       and vulnerability-scans it. On a `v*` tag it then
#                       pushes the scanned image to ghcr.io/<owner>/kern-*. `needs` every job above
#                       except secret-scan/fiscal-gates — this is the
#                       expensive lane and must not start until the cheap
#                       ones are green.
#
# Every third-party action below is pinned to a commit SHA (docs/
# DEPENDENCY-POLICY.md §1); the trailing comment names the tag that SHA
# resolves to, verified against the GitHub API on 2026-09-08.

name: CI

on:
  push:
    # Local repo is currently on `master` with no commits yet (never pushed
    # to a remote) and no ADR/doc fixes a final default-branch name — see
    # docs/handoff/008-ci-pipeline.md "Open questions". Triggering on both
    # avoids CI silently never running because of a name mismatch; drop
    # whichever one turns out unused once the repo has a real remote.
    branches: [main, master]
    # A release: the same pipeline, and the images it scanned are published.
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Read-only unless a job says otherwise; only `containers` writes, and only packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Secret scanning — BLUEPRINT.md §4.10 / docs/DEPENDENCY-POLICY.md §5.
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace:ro \
            -v "${{ github.workspace }}/.github/gitleaks":/gcfg:ro \
            -w /workspace \
            zricethezav/gitleaks:v8.30.1 dir . --no-banner \
            --gitleaks-ignore-path=/gcfg/.gitleaksignore

  # ---------------------------------------------------------------------
  # Fiscal gates — BLUEPRINT.md §22 "Tax changes" gates. PLACEHOLDER: real
  # ruleset/tax-engine code does not exist yet (Milestone 4/5). See the
  # script for exactly what this does and does not prove, and for the
  # canary that fails the build the moment real fiscal content lands
  # without this job being upgraded first.
  # ---------------------------------------------------------------------
  fiscal-gates:
    name: Fiscal gates (placeholder — M4/M5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run fiscal gates
        run: bash .github/scripts/fiscal-gates-placeholder.sh

  # ---------------------------------------------------------------------
  # PHP — apps/api. No database needed for any of these five checks.
  # ---------------------------------------------------------------------
  php-quality:
    name: PHP quality (validate, audit, Pint, PHPStan, Deptrac)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, bcmath, intl, pcntl, sodium
          tools: composer:2.10.3
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist

      # Cheapest checks first (docs/AGENTS.md §7's ordering intent, applied
      # inside the job too): a broken composer.json fails in milliseconds,
      # PHPStan takes the longest.
      - name: composer validate
        # `--no-check-all`: the kern/* packages are path repositories required at `@dev`, the
        # one form a path package can take. Everything else `--strict` checks still fails the job.
        run: composer validate --strict --no-check-all

      - name: composer audit
        run: composer audit

      - name: Pint
        run: vendor/bin/pint --test

      # `../../packages` is the local Composer packages. PHPStan and Deptrac already reach them
      # through their own config files (`phpstan.neon`'s paths, `deptrac.php`'s); Pint takes a path.
      - name: Pint (packages)
        run: vendor/bin/pint --test ../../packages

      - name: PHPStan
        env:
          # Non-secret, test-only Laravel APP_KEY (see php-tests job below
          # for why one is needed at all). Encrypts nothing that outlives
          # this job.
          APP_KEY: "base64:8nv5QLUkFwcF+ILRrO9PfkhDAoI83n8i89yBdebg2lo="
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Deptrac (module boundaries, BLUEPRINT.md §2.1)
        run: vendor/bin/deptrac analyse --config-file=deptrac.php

  php-tests:
    name: PHP tests (Pest, real Postgres + Redis)
    runs-on: ubuntu-latest
    needs: php-quality
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        # The same pin as compose.services/postgres.yaml — `make pins` checks both
        # pgvector/pgvector, not a bare postgres image, so the vector/
        # unaccent/pg_trgm extensions this project needs are present.
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_DB: kern_test
          POSTGRES_USER: kern
          POSTGRES_PASSWORD: kern_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kern"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.10.2-trixie@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Non-secret, test-only Laravel APP_KEY. Never used outside this CI
      # job's ephemeral service containers; encrypts nothing that outlives
      # it. Real per-environment keys are generated at deploy time and
      # never committed (BLUEPRINT.md §4.10).
      APP_KEY: "base64:8nv5QLUkFwcF+ILRrO9PfkhDAoI83n8i89yBdebg2lo="
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kern_test
      DB_USERNAME: kern
      DB_PASSWORD: kern_ci
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, bcmath, intl, pcntl, sodium
          tools: composer:2.10.3
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist

      # Laravel's dotenv loader warns (Pest turns the warning into a test
      # WARN, not a clean PASS) when no .env file is present at all, even
      # though every value it would contain is supplied via real env vars
      # above. No .env is committed (BLUEPRINT.md §4.10) or shipped in the
      # runtime image, so create an empty one for this job only — verified
      # locally (docs/handoff/008-ci-pipeline.md) that this is the only
      # difference between a WARN and a clean PASS here.
      - name: Touch empty .env (see comment)
        run: touch .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Pest
        run: vendor/bin/pest

  # ---------------------------------------------------------------------
  # Each package on its own — the lane php-tests cannot be.
  # ---------------------------------------------------------------------
  package-suites:
    name: Package suites (kern/*, each installed alone)
    runs-on: ubuntu-latest
    needs: php-quality
    services:
      postgres:
        # Same image as php-tests: `kern/audit` needs `SELECT … FOR UPDATE`
        # and a trigger, `kern/legislation` needs pgvector and pg_trgm.
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_DB: kern_pkg_test
          POSTGRES_USER: kern
          POSTGRES_PASSWORD: kern_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kern"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Read by each package's own TestCase. No APP_KEY: none of these suites
      # encrypts anything with Laravel's own encrypter — the platform's cipher
      # takes its keys from the in-memory KMS double these suites bind.
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: kern
      DB_PASSWORD: kern_ci
      KERN_PACKAGE_TEST_DATABASE: kern_pkg_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, bcmath, intl, pcntl, sodium
          tools: composer:2.10.3
          coverage: none

      # One suite per package, each with its own vendor directory — sharing the
      # application's would let a test resolve a class from a package this one
      # does not require, which is the whole property under test.
      #
      # No `composer.lock` is committed for a package and none is restored here,
      # so each run resolves against the newest versions its constraints allow.
      # That is the right default for a library: the lock belongs to the
      # application that installs it, and this lane is where a dependency that
      # broke its own compatibility promise should surface.
      #
      # Sequential, not a matrix: every suite migrates the same `kern_pkg_test`
      # database from nothing, so two of them at once would drop each other's
      # tables mid-run.
      - name: Run every package's suite
        run: |
          set -euo pipefail
          for package in packages/*/; do
            name="$(basename "$package")"
            echo "::group::kern/$name"
            (cd "$package" && composer install --no-interaction --prefer-dist && vendor/bin/pest)
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------
  # JavaScript/TypeScript — apps/api (Inertia/React frontend).
  # ---------------------------------------------------------------------
  js-api:
    name: JS/TS — apps/api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.6"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: npm ci
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format

      - name: tsc --noEmit
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

      # No frontend test suite exists yet — apps/api/resources/js has no
      # test files and package.json has no "test" script (see docs/handoff/
      # 002-laravel-scaffold.md: M0 scaffold only, one static page). BLUEPRINT.md
      # §22 asks for "frontend tests"; per docs/AGENTS.md ("if a gate
      # genuinely can't run yet, leave it out and document why rather than
      # faking a pass"), this step is intentionally absent, not stubbed.
      # Add it back the moment the first *.test.tsx file exists.

      - name: npm audit
        run: npm audit --audit-level=high

      # Consumed by the `containers` job to build the edge (Caddy) image
      # without re-running Vite on a second runner.
      - name: Upload Vite build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: apps/api/public/build
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # JavaScript/TypeScript — apps/browser-worker (Playwright worker).
  #
  # In the same Playwright image `make test` and docker/playwright/Dockerfile
  # use: the tests start Chromium, which a bare runner does not have, and
  # the browser must be the one that ships in production.
  # ---------------------------------------------------------------------
  js-browser-worker:
    name: JS/TS — apps/browser-worker
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --shm-size=1gb
    defaults:
      run:
        working-directory: apps/browser-worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-node: the image's own Node (24) is the one production runs, and the test
      # script's glob needs Node 21 or later.
      - name: npm ci
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (node --test)
        run: npm test

      - name: npm audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # Python — apps/processing.
  # ---------------------------------------------------------------------
  python:
    name: Python — apps/processing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/processing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/processing/uv.lock

      - name: uv lock --check
        run: uv lock --check

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pyright
        run: uv run pyright

      - name: pytest
        run: uv run pytest -q

      - name: pip-audit
        run: uv run pip-audit

  # ---------------------------------------------------------------------
  # Containers & security — the expensive lane. Gated behind every lint/
  # test job above (docs/AGENTS.md §7's "run these before declaring done",
  # applied at pipeline level: don't spend minutes building four images for
  # a change that doesn't even pass Pint).
  #
  # Each image is production-shape (the same Dockerfile/target compose.yaml
  # uses), never the `test` stage — dev tooling is not shipped, and is not
  # what gets scanned here.
  # ---------------------------------------------------------------------
  containers:
    name: Containers (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [php-quality, php-tests, package-suites, js-api, js-browser-worker, python]
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades this run's GitHub identity for a short-lived certificate,
      # so there is no signing key to store, leak or rotate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `name` is the image: ghcr.io/<owner>/kern-<name>. The PHP image needs the Vite build
          # too — Laravel reads public/build/manifest.json to render every page.
          - name: app
            context: .
            file: docker/php/Dockerfile
            target: runtime
            needs_frontend: true
          - name: processing
            context: .
            file: docker/python/Dockerfile
            target: runtime
            needs_frontend: false
          - name: edge
            context: .
            file: docker/caddy/Dockerfile
            target: ""
            needs_frontend: true
          # `runtime` named: the Dockerfile's last stage is `test`.
          - name: browser-worker
            context: .
            file: docker/playwright/Dockerfile
            target: runtime
            needs_frontend: false
          - name: certs
            context: docker/certs
            file: docker/certs/Dockerfile
            target: ""
            needs_frontend: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The edge (Caddy) image bakes in apps/api/public — including
      # public/build, which is gitignored (Vite output, not source) and
      # therefore not in this checkout. Reuse the js-api job's build
      # instead of running Vite a second time on a second runner.
      - name: Download Vite build output
        if: matrix.needs_frontend == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: apps/api/public/build

      # The browser-worker image carries Chromium, and Trivy exports the whole image to scan it: with
      # the image in the build cache, in Docker and in Trivy's copy at once, the runner's disk ran
      # out ("no space left on device"). The runner image's preinstalled toolchains — .NET, Android,
      # Haskell, CodeQL — are nothing this job uses, and removing them is what frees the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          tags: kern-${{ matrix.name }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: kern-${{ matrix.name }}:ci
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Severity threshold: CRITICAL/HIGH only, and only vulnerabilities
      # with a fix already published (`ignore-unfixed`) — an unfixed base-
      # OS CVE in a Debian trixie package is not something changing this
      # repo's code can resolve, and would otherwise turn this into a gate
      # nobody can ever satisfy. This still fails real, actionable findings
      # — verified locally (docs/handoff/008-ci-pipeline.md) against the
      # real images this workflow builds, which currently have three such
      # findings recorded there and in docs/STATUS.md's Known issues table.
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kern-${{ matrix.name }}:ci
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Only on a release tag, and only after the scan above passed: what is published is the
      # image that was scanned, retagged, not a second build.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # GHCR names must be lower case; an owner's need not be.
          OWNER: ${{ github.repository_owner }}
          NAME: kern-${{ matrix.name }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/$NAME"
          version="${TAG#v}"
          docker tag "$NAME:ci" "$image:$version"
          docker push "$image:$version"
          # `latest` only for a plain release, never for v1.2.0-rc1.
          case "$version" in
            *-*) ;;
            *) docker tag "$NAME:ci" "$image:latest" && docker push "$image:latest" ;;
          esac
          # The digest that was pushed, for the signing step: a signature names one exact build,
          # never a tag, which can be moved after it was signed.
          printf 'ref=%s\n' "$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$version")" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # Proof of where the image came from. The certificate inside the signature names this
      # repository, this workflow and this tag; scripts/verify-images.sh refuses an image whose
      # signature does not name all three, so an image pushed to the registry by anything other
      # than this job, at this tag, never starts. The signature is also written to Sigstore's
      # public log, so a signing nobody expected cannot be done quietly.
      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$REF"
