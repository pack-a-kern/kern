# Plain HTTP exists only to redirect. The edge is published on a public IP, so leaving a login
# form reachable over http:// means passwords cross the internet in clear text — habit is enough
# to make that happen. /healthz stays on HTTP so the container healthcheck needs no TLS trust.
server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # TLS. Without this the login password crosses the internet in clear text — the edge is
    # published on a public IP. The dev certificate is self-signed; swap in a CA-issued one
    # (Let's Encrypt, once a domain points here) by replacing these two files.
    ssl_certificate     /etc/nginx/certs/taxos.crt;
    ssl_certificate_key /etc/nginx/certs/taxos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is deliberately NOT set while the certificate is self-signed: it would pin browsers
    # to HTTPS for a cert they refuse, making the site unreachable. Enable it with a real cert.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/html/public;
    index index.php;

    # `app` is resolved at request time (Docker's embedded DNS, 127.0.0.11),
    # not once at config load. A static `fastcgi_pass app:9000;` makes nginx
    # refuse to start at all if the app container isn't already running —
    # confirmed by a real boot test — and would keep serving a stale IP
    # across the app container's restarts.
    resolver 127.0.0.11 valid=10s;

    # Self-contained liveness check — proves nginx itself works without
    # depending on php-fpm/app being reachable. Verified 2026-09-07.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Reverb (WebSockets) through the same origin, so the browser needs no extra published port
    # and inherits the TLS above. Reverb speaks the Pusher protocol and serves the client
    # handshake at /app/{key}; the server-side publish leg (/apps/{id}/events) stays on the
    # internal network and is deliberately NOT proxied — nothing outside should be able to
    # broadcast. `set` + `resolver` so nginx starts even when reverb is down, matching the
    # fastcgi_pass reasoning above.
    location /app/ {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A WebSocket is idle by design between events; the default 60s would drop it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        # SCRIPT_FILENAME must resolve inside the `app` (php-fpm) container's
        # filesystem, not this one — both images copy apps/api/public from
        # the same build context, so the paths line up.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param REQUEST_ID $request_id;
        fastcgi_read_timeout 60s;
    }

    # Never serve dotfiles (.env, .git, etc.) even if one ends up under public/.
    location ~ /\. {
        deny all;
    }
}
