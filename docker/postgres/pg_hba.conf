# Who may connect to Postgres, and how — mounted over the image's own (compose.services/postgres.yaml).
#
# Over the network, TLS or nothing: the certificate is issued by docker/certs, and the application
# connects with `sslmode=verify-full` against the stack's CA. A client that does not ask for TLS is
# refused outright rather than sent its password in clear text — the `reject` line, which a
# connection without TLS reaches because `hostssl` matches only one with it.
#
# The image's own file also trusted any connection from 127.0.0.1 inside this container, and allowed
# replication. Nothing here uses either: the healthcheck and the init scripts use the Unix socket,
# which stays trusted — it is reachable only from inside this container.

# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            trust
hostssl  all       all   all      scram-sha-256
host     all       all   all      reject
