# redis — one of the services an installation may run here or point elsewhere.
#
# Redis. Leave this file out of COMPOSE_FILE and point REDIS_HOST at a server you already
# run. Note the password handling in the service below: it is read from the environment at
# start rather than interpolated into argv, and that reasoning holds wherever it runs.
#
# Compose merges files, so this one carries both halves of the choice: the service itself and
# anything that waits for it. See docs/INSTALLER-PLAN.md §3 and the COMPOSE_FILE line in
# apps/api/.env.example.

services:
  redis:
    image: redis:8.10.2-trixie@sha256:5c02d7c0f8d75af45958c0294a8004f2e14b42df98a1103e3a669aa7ec787be6
    # The password is read from the environment at start, NOT interpolated into argv by compose.
    #
    # Two reasons, both learned the hard way. Interpolating it here bakes the secret into the
    # container's command, where `docker inspect` and the host process list expose it in clear
    # text. And it makes the password part of the container's identity: the value only changes on
    # recreate, so `docker compose up -d --force-recreate app` on its own leaves redis running with
    # the previous password while the app has the new one — every request then fails with
    # `WRONGPASS`, which reads as an application error and is not one. Reading it from the same
    # `environment:` block the app uses means both sides resolve the same value from the same
    # place; `docker/redis/entrypoint.sh` also refuses to start on an unset or placeholder value,
    # so a misconfiguration fails loudly at boot instead of at the first request.
    command: ["/usr/local/bin/kern-redis-entrypoint.sh"]
    # Reaps the certificate watcher the entrypoint starts (docker/tls/kern-tls.sh), and passes the stop
    # signal on to redis-server.
    init: true
    networks:
      - app_net
      - data_net
    volumes:
      - redis_data:/data
      - ./docker/redis/entrypoint.sh:/usr/local/bin/kern-redis-entrypoint.sh:ro
      # TLS only — the key and certificate docker/certs issues it, and the watcher that reloads them.
      - tls_redis:/run/kern/tls:ro
      - ./docker/tls/kern-tls.sh:/usr/local/bin/kern-tls:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # redis-server's entrypoint uses `setpriv` to drop from root to the
      # `redis` user. Confirmed by a real boot test: without SETPCAP,
      # setpriv itself fails ("apply bounding set: Operation not
      # permitted") before redis ever starts. 2026-09-07.
      # These are root's, for the moment before the drop — chowning the
      # data directory, then setpriv itself. redis-server runs as `redis`
      # with every capability cleared (CapEff 0, verified 2026-10-20); it
      # ran as root until docker/redis/entrypoint.sh handed over to the
      # image's entrypoint instead of starting redis-server directly.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - SETPCAP
      # For the stop signal `init` passes on from root to the `redis` user. Without it the signal does
      # not arrive, and a stop is a kill ten seconds later.
      - KILL
    depends_on:
      certs:
        condition: service_healthy
    healthcheck:
      # The password in `REDISCLI_AUTH`, which redis-cli reads, and not after `-a`: this runs every ten
      # seconds, and `-a` put the password on redis-cli's command line each time — readable by any
      # account on the host with `ps`, for as long as the check ran. The shell sees the variable's
      # name here, never its value.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --tls --cacert /run/kern/tls/ca.crt ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD — see apps/api/.env.example}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  # Its certificate, from the stack's CA, handed to the image's `redis` user.
  certs:
    environment:
      KERN_CERT_redis: "999:999:redis,localhost,127.0.0.1"
    volumes:
      - tls_redis:/certs/out/redis

  # The four PHP processes cannot boot without this, so the dependency lives here rather
  # than in compose.yaml: leave this file out of COMPOSE_FILE and both the service and
  # every wait for it disappear together. The ones that use it connect over TLS, checking the
  # certificate against the stack's CA — set here because it is true of this server; one you run
  # elsewhere is described in REDIS_SCHEME and REDIS_CA_CERT instead.
  app: &connects-to-redis
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_SCHEME: tls
      REDIS_CA_CERT: /run/kern/tls-ca/ca.crt
  queue: *connects-to-redis
  scheduler: *connects-to-redis
  # Booting the framework reads the stored settings through the cache, so a migration needs Redis too.
  migrate: *connects-to-redis
  reverb:
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  tls_redis:
