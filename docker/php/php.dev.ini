; Development-only PHP overrides. Mounted by `compose.dev.yaml`, never COPYed into any image,
; so production keeps `docker/php/php.ini` exactly as written.
;
; Why this file exists
; -------------------
; `php.ini` sets `opcache.validate_timestamps = 0`, which is correct for production: the image is
; immutable, so re-checking every file's mtime on every request is pure waste.
;
; In development the source is NOT the image's copy — `compose.dev.yaml` bind-mounts
; `./apps/api` over `/var/www/html`, so an edit on the host is already inside the container the
; instant it is saved. With timestamp validation off, php-fpm still served the frozen compiled copy
; from when it started, and every PHP or config change needed `docker compose up -d
; --force-recreate app` before the browser could see it. The CLI hid the problem rather than
; revealing it: `opcache.enable_cli = 0`, so `php artisan ...` read the edited file directly and
; reported the new behaviour while the browser was still running the old code.
;
; Filename
; --------
; `conf.d` is read in alphabetical order and later files win. `zz-` guarantees this lands after
; `99-kern.ini`. A file named `99-kern-dev.ini` would NOT work: '-' (0x2D) sorts before '.'
; (0x2E), so it would load first and then be overwritten by the very file it means to override.

[opcache]
; Check each file's mtime and recompile when it changes — normal Laravel development behaviour.
opcache.validate_timestamps = 1
; Check on every request rather than at an interval. The stat() cost is irrelevant next to waiting
; on a container recreate, and a 2-second window is long enough to make a change look like it did
; not apply.
opcache.revalidate_freq = 0
