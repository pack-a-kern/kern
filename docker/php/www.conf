; TaxOS România — php-fpm pool for the app/queue/scheduler/reverb image.
; Runs as non-root `appuser` (uid 10001), created in docker/php/Dockerfile.

[www]
; No `user`/`group` here: the container process itself already runs as the
; non-root `appuser` (Dockerfile `USER appuser`), so fpm's master never
; starts as root and has nothing to drop privileges from — setting these
; only produces an ignored-directive notice at startup.

; TCP, not a unix socket: nginx (edge) reaches this container over
; edge_net by service name, and the container's root filesystem is
; read-only (no socket file to create).
listen = 0.0.0.0:9000
listen.owner = appuser
listen.group = appuser

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Exposed only inside the container network, never through the edge proxy.
; Used by the Docker healthcheck (docker/php/Dockerfile) via cgi-fcgi, and
; works even before apps/api exists because fpm answers it internally.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Container environment variables (DB_*, REDIS_*, etc.) must reach PHP via
; getenv()/$_ENV — do not clear them.
clear_env = no

; stdout/stderr, not files — read-only root filesystem, and container logs
; are the collection point (BLUEPRINT.md §23).
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
