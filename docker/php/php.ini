; TaxOS România — production-oriented php.ini overrides.
; BLUEPRINT.md §1.2 / §23: no PII in logs, deterministic money handling elsewhere
; in application code. This file only sets runtime/opcache/upload behaviour.

[PHP]
; Never leak the PHP version to clients.
expose_php = Off

; Document capture (PWA camera uploads) needs headroom above PHP defaults,
; but is bounded — actual AV/size policy enforcement lives in
; Domain/Documents (BLUEPRINT.md §14.2), this is only the outer PHP ceiling.
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Errors go to stderr (container log), never rendered to the client.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Timestamps in application code are explicit (BLUEPRINT.md §18); this is only
; the interpreter default used by date()/time() helpers Laravel does not
; override.
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Set to 1 only in local dev via compose.override.yaml; production must not
; stat() every file on every request.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

[session]
; Laravel manages its own session driver/cookies; disable the native PHP
; session handler's cookie so the two never collide.
session.use_strict_mode = 1
