# Kern — container topology (BLUEPRINT.md §3).
#
# This file holds the application and nothing else: the edge and the four PHP processes. Every
# service an installation may instead point at one it already runs lives in its own file under
# compose.services/, and `COMPOSE_FILE` in apps/api/.env chooses which of those are loaded.
#
# So this file on its own does NOT start a working stack — it has no database. That is deliberate:
# the alternative was `profiles:`, and a `depends_on` naming a service whose profile is inactive
# makes the whole project invalid ("depends on undefined service"), verified against compose 5.6.0.
# Splitting by file is the only shape where leaving a service out also leaves out everything that
# waits for it. See docs/INSTALLER-PLAN.md §3.
#
# `COMPOSE_FILE` also SUPPRESSES the automatic loading of compose.dev.yaml, so a development
# list has to name it explicitly, last. apps/api/.env.example carries the full line.
#
# This is the production-shape file: no host ports on postgres/redis,
# app_net and data_net are `internal: true` (no outbound Internet), and
# every image is pinned to an exact tag (docs/DEPENDENCY-POLICY.md).
# compose.dev.yaml adds dev-only conveniences (mailpit, published DB
# ports, bind-mounted source) on top of this file — do not add those things
# here.
#
# Network segmentation (see docs/handoff/001-docker-topology.md for the full
# matrix and the reasoning behind the two extra `app`/`queue`/`scheduler`/
# `reverb` -> data_net attachments beyond BLUEPRINT.md §3.3's literal list):
#   edge_net        edge, app, reverb                              — not internal
#   app_net         app, queue, scheduler, reverb,          — internal
#                   redis, openbao
#   processing_net  app, python-api,                        — not internal
#                   clamav
#   data_net        postgres, redis, app, queue,            — internal
#                   scheduler, reverb
#   browser_net     app, browser-worker                     — not internal
#
# Networks stay declared here, all five, because every one of them has a member that is always
# present: app alone joins edge_net, app_net, processing_net, browser_net and data_net. A
# compose.services/ file only references them.
#
# Production digest pinning (§3.4 "immutable image tags through digest in
# production"): this file pins exact tags for reproducible local/dev builds
# per docs/DEPENDENCY-POLICY.md. A production deploy additionally locks each
# image to its digest, e.g.:
#
#   postgres:
#     image: pgvector/pgvector:pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
#
# (digest verified 2026-09-07 — see the handoff note for the full table).
# Do not add digests to the tags below; that is a production overlay
# decision for whoever builds the deploy pipeline, not this dev-shape file.

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
  processing_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
  browser_net:
    driver: bridge

# Only the volumes the four PHP processes need. Every other volume is declared in the
# compose.services/ file of the service that uses it, so leaving that file out of COMPOSE_FILE
# leaves nothing behind.
volumes:
  app_storage:
  app_bootstrap_cache:
  caddy_data:

x-php-image: &php-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
  # The one file this installation is configured in — see apps/api/.env.example. Every variable in
  # it is handed to these four containers as a real environment variable, and Laravel prefers a real
  # environment variable over anything a `.env` inside the image might say.
  #
  # Deliberately the whole file rather than a list of names: this block used to enumerate sixty
  # variables, and a value set in the env file but not named here simply never arrived — a silent
  # failure that looked like the setting not working. It also meant compose.yaml held application
  # settings of its own, so the file an operator reads was not the file that decided anything.
  #
  # `python-api` and `browser-worker` do NOT get this file. They are on networks that carry no database
  # or object-storage credentials (BLUEPRINT.md §3.3), and handing them the whole environment would
  # undo that; each names the few variables it needs.
  env_file:
    - apps/api/.env
  # Not configuration — every one of these is already in the file above, and takes its value from it.
  # They are named again only so that an EMPTY one stops the stack, which is what `:?` does. Without
  # a key the application cannot encrypt; without blind-index keys it cannot look up an encrypted
  # column; with an empty Reverb secret it would publish events under a secret anyone can guess. A
  # deployment that is missing one of these must fail to start, not start and fail later.
  environment:
    APP_NAME: ${APP_NAME:?set APP_NAME — see apps/api/.env.example}
    APP_KEY: ${APP_KEY:?set APP_KEY — see apps/api/.env.example}
    CRYPTO_BLIND_INDEX_KEYS: ${CRYPTO_BLIND_INDEX_KEYS:?set CRYPTO_BLIND_INDEX_KEYS — see apps/api/.env.example}
    REVERB_APP_ID: ${REVERB_APP_ID:?set REVERB_APP_ID — see apps/api/.env.example}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY — see apps/api/.env.example}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?set REVERB_APP_SECRET — see apps/api/.env.example}
  volumes: &php-volumes
    - app_storage:/var/www/html/storage
    - app_bootstrap_cache:/var/www/html/bootstrap/cache
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  # -------------------------------------------------------------------------
  # Edge
  # -------------------------------------------------------------------------
  edge:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    ports:
      - "${EDGE_HTTP_PORT:-80}:8080"
      - "${EDGE_HTTPS_PORT:-443}:8443"
    # Which address this installation answers on, and how it proves it is that address. Both are
    # listed without a value on purpose: compose then passes each one through only when the
    # environment actually sets it, so the single place either default lives is the Caddyfile. A
    # default written here as well would be a second answer to the same question.
    environment:
      - KERN_EDGE_SITE
      - KERN_EDGE_TLS
      # And how ACME proves this name, for an installation behind a proxy that answers port 80
      # itself. Both empty unless the installer's fourth TLS answer was chosen; the Caddyfile's
      # global options explain why the whole directive is a variable rather than just the provider.
      - KERN_EDGE_ACME_DNS
      - KERN_EDGE_DNS_TOKEN
    volumes:
      # TLS material. The edge is published on a public IP, so plain HTTP would put the login
      # password on the wire in clear text. Both halves are gitignored and written by `make certs`;
      # the pair is self-signed, so a browser warns until the installer obtains a real one.
      - ./docker/caddy/certs:/etc/caddy/certs:ro
      # Caddy's TLS state: its own CA under `tls internal`, and the ACME account key and
      # certificates once a domain is configured. A named volume and not a tmpfs, because
      # re-issuing on every restart is how an installation reaches Let's Encrypt's rate limit.
      - caddy_data:/data
    networks:
      - edge_net
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      # Caddy's autosave directory. It stays empty while the admin API is off (see the Caddyfile),
      # but the process still creates it at boot, and mode 1777 because the container is not root.
      - /tmp:mode=1777
      - /config:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # busybox wget, which the alpine base already has — nothing is installed for this. curl was
      # the nginx image's answer and needed an apt-get.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Laravel — app / queue / scheduler / reverb (same image, four processes)
  # -------------------------------------------------------------------------
  app:
    <<: *php-image
    networks:
      - edge_net
      - app_net
      - processing_net
      - browser_net
      - data_net
    # A private AI endpoint — one on a VPN or a LAN — usually resolves only through the *host's*
    # /etc/hosts, which containers never read. The result is a provider that answers fine from a
    # terminal and is unreachable from the app, with nothing in the error to say why.
    #
    # Set both halves in apps/api/.env to publish that mapping inside the container. The default is
    # a deliberately unroutable placeholder, so leaving them unset changes nothing for anyone whose
    # provider has ordinary public DNS.
    extra_hosts:
      - "${AI_ENDPOINT_HOST:-ai-endpoint.invalid}:${AI_ENDPOINT_IP:-127.0.0.1}"
    healthcheck:
      # Proves php-fpm's port accepts connections. It does NOT prove the pool answers a request —
      # see below for why there is nothing better here, and `/healthz` on the edge plus `make smoke`
      # for the checks that do exercise a real request.
      #
      # It used to run `cgi-fcgi -bind -connect 127.0.0.1:9000`, whose comment claimed it hit
      # `pm.status_path`. It did not: with no SCRIPT_NAME it asks php-fpm for nothing, and measured
      # on 2026-10-15 it failed 12 times out of 12 — as did `/fpm-ping` and `/fpm-status` with the
      # names set, because cgi-fcgi also wants a CGI stdin this never gave it. The container had
      # reported healthy for days only because it was created before that healthcheck existed;
      # Docker keeps the check a container was created with, so the first recreate turned a serving
      # php-fpm unhealthy and took the edge down with it (`depends_on: app: service_healthy`).
      #
      # Probed with php rather than /dev/tcp: this image's /bin/sh is dash and /dev/tcp is a bash
      # builtin — the same reason reverb's check is written this way, and the same trap that once
      # reported a listening Reverb as unhealthy.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000, $$e, $$s, 3) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  queue:
    <<: *php-image
    command: ["php", "artisan", "horizon"]
    networks:
      - app_net
      - data_net
      # processing_net is required, not optional: ScanQuarantinedDocument reaches `clamav` and
      # ProcessScannedDocument reaches `python-api`, and BOTH run on this worker, not in `app`.
      # Without it every queued document silently fails its scan/extraction step even though the
      # same code works when exercised synchronously from `app` (which does have the network).
      - processing_net
    # A private AI endpoint — one on a VPN or a LAN — usually resolves only through the *host's*
    # /etc/hosts, which containers never read. The result is a provider that answers fine from a
    # terminal and is unreachable from the app, with nothing in the error to say why.
    #
    # Set both halves in apps/api/.env to publish that mapping inside the container. The default is
    # a deliberately unroutable placeholder, so leaving them unset changes nothing for anyone whose
    # provider has ordinary public DNS.
    extra_hosts:
      - "${AI_ENDPOINT_HOST:-ai-endpoint.invalid}:${AI_ENDPOINT_IP:-127.0.0.1}"
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          # Every Horizon worker shares this: the master, the default workers, the model worker and
          # the one reading laws — and one consolidation of the Codul fiscal is ~7.6 MB of HTML held
          # as a DOM. At 512M the kernel killed that worker mid-page (2026-09-22).
          memory: ${QUEUE_MEMORY_LIMIT:-2G}

  scheduler:
    <<: *php-image
    command: ["php", "artisan", "schedule:work"]
    networks:
      - app_net
      - data_net
    volumes:
      # Its own list replaces the shared one rather than adding to it — YAML merges keys, not the
      # lists under them — so the two writable volumes every PHP service needs are repeated here.
      # Without them the scheduler wrote into the image's read-only, root-owned `storage` and
      # `bootstrap/cache`, failed on every tick, and its heartbeat went silent.
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./docker/php/scheduler-healthcheck.php:/usr/local/bin/scheduler-healthcheck.php:ro
    healthcheck:
      # Asserts the schedule *ran*, via a heartbeat file the schedule itself touches every minute
      # (see bootstrap/app.php). The previous check ran `pgrep`, which is not installed in this
      # image, so it failed from its first tick onward whatever the scheduler was doing — and a
      # process check could not have seen a scheduler that is alive but wedged anyway.
      test: ["CMD", "php", "/usr/local/bin/scheduler-healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Longer than the heartbeat's own cadence: the first tick has to happen before a missing
      # file can mean anything.
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  reverb:
    <<: *php-image
    command: ["php", "artisan", "reverb:start"]
    networks:
      # edge_net so the edge can proxy the browser's WebSocket handshake to it (see
      # docker/caddy/Caddyfile, `handle /app/*`). Without this the edge cannot resolve
      # `reverb` at all and every client falls back to no live updates, silently.
      - edge_net
      - app_net
      - data_net
    healthcheck:
      # Reverb exposes no documented HTTP health route as of this check
      # (2026-09-07) — this only proves the WebSocket port accepts TCP
      # connections. See "What is NOT done".
      # Probed with php, not /dev/tcp: this image's /bin/sh is dash, and /dev/tcp is a bash
      # builtin — so the old CMD-SHELL check could never succeed and reported a healthy,
      # listening Reverb as unhealthy, which blocks any depends_on: service_healthy on it.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080, $$e, $$s, 3) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M






