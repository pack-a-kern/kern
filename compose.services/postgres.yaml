# postgres — one of the services an installation may run here or point elsewhere.
#
# PostgreSQL. Leave this file out of COMPOSE_FILE and point DB_HOST at a server you
# already run — apps/api/.env.example says so at the DB_HOST line, and the service's own
# comment below explains why it takes the application's credentials rather than its own.
#
# Compose merges files, so this one carries both halves of the choice: the service itself and
# anything that waits for it. See docs/INSTALLER-PLAN.md §3 and the COMPOSE_FILE line in
# apps/api/.env.example.

services:
  # -------------------------------------------------------------------------
  # Data layer — no host ports, data_net is internal (no outbound Internet).
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    # TLS, with the certificate docker/certs issues it, and no connection over the network without it
    # (docker/postgres/pg_hba.conf). The image's own entrypoint still runs — it initialises a new
    # volume and drops to the `postgres` user — behind the watcher that tells the server to reload a
    # renewed certificate: SIGHUP, which Postgres answers by reading it again, with no restart.
    init: true
    entrypoint: ["sh", "/usr/local/bin/kern-tls", "run", "HUP", "--", "docker-entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/kern/tls/server.crt
      - -c
      - ssl_key_file=/run/kern/tls/server.key
      - -c
      - hba_file=/etc/kern/pg_hba.conf
    networks:
      - data_net
    # Created with the credentials the APPLICATION connects with, not with names of its own. The
    # database the application asks for is the database that exists, and pointing DB_HOST at a
    # Postgres you already run means this container is simply never started — there is no second
    # place to keep the password in step.
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kern}
      # The owner — the role the image creates on first boot, which creates every table. Not what the
      # application connects as: that is DB_USERNAME, created by `migrate` (kern:db:grant-app-role).
      POSTGRES_USER: ${DB_OWNER_USERNAME:-kern}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD — see apps/api/.env.example}
    volumes:
      # Postgres 18's own image changed convention: mount the parent
      # `/var/lib/postgresql`, not `/var/lib/postgresql/data` — the image
      # now places data in a major-version subdirectory for pg_upgrade
      # compatibility. Mounting the old path produces a working-but-warning
      # container (confirmed 2026-09-07); this is the path its own
      # entrypoint recommends.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/pg_hba.conf:/etc/kern/pg_hba.conf:ro
      - tls_postgres:/run/kern/tls:ro
      - ./docker/tls/kern-tls.sh:/usr/local/bin/kern-tls:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The official postgres entrypoint starts as root and drops to the
      # `postgres` user itself (gosu) — it needs these four to do that and
      # to fix up ownership of a fresh volume. Confirmed by a real boot
      # test: `cap_drop: [ALL]` alone makes initdb fail with
      # "Operation not permitted" on chown. 2026-09-07.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      # For the two signals that cross from root to the `postgres` user: the watcher's reload, and the
      # stop signal `init` passes on. Without it neither arrives — the reload silently, and a stop as a
      # kill ten seconds later.
      - KILL
    depends_on:
      certs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
    restart: unless-stopped

  # Its certificate, from the stack's CA: the uid and gid are the image's `postgres` user, which is the
  # only owner Postgres accepts a key from with no group access.
  certs:
    environment:
      KERN_CERT_postgres: "999:999:postgres,localhost,127.0.0.1"
    volumes:
      - tls_postgres:/certs/out/postgres

  # The four PHP processes cannot boot without this, so the dependency lives here rather
  # than in compose.yaml: leave this file out of COMPOSE_FILE and both the service and
  # every wait for it disappear together. The ones that connect do so over TLS, checking the
  # certificate is the stack's and is for `postgres` (verify-full) — set here because it is true of
  # this server; one you run elsewhere is described in DB_SSLMODE and DB_SSLROOTCERT instead.
  app: &connects-to-postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /run/kern/tls-ca/ca.crt
  queue: *connects-to-postgres
  scheduler: *connects-to-postgres
  migrate: *connects-to-postgres
  reverb:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  tls_postgres:
