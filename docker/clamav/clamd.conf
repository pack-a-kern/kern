# clamd's whole configuration, mounted read-only over the image's own copy.
#
# Mounted rather than set through the image's `CLAMD_CONF_*` variables: the entrypoint applies
# those with `sed -i` against this file, and `read_only: true` on the service forbids that — it
# crash-loops on "sed: couldn't open temporary file ... Read-only file system". Mounting works
# because the entrypoint writes to clamd.conf *only* inside that `CLAMD_CONF_*` loop, and the
# service sets no such variable.
#
# The first five directives are the image's effective configuration, copied verbatim (verified
# against clamav/clamav:1.5-debian13-slim on 2026-10-14) so this file changes nothing but the two
# settings below them. `LocalSocket` has to stay: the entrypoint waits for either that socket or
# /run/clamav/clamd.sock to appear before it considers clamd up, and the image's own
# `clamdcheck.sh` HEALTHCHECK reads this file to find it.

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Free the old signature database before loading the new one, instead of holding both.
#
# The default (`yes`) is why this service was sized at 3 GB: ~1.0 GB of signatures resident, doubled
# for the duration of a freshclam update. That transient is what crossed the old 1 GB limit
# mid-"Activating the newly loaded database" on 2026-09-10 and had the kernel kill clamd.
#
# The cost is that clamd stops answering for the few seconds of a reload, once a day
# (`FRESHCLAM_CHECKS` defaults to 1). An upload landing in that window is refused rather than
# scanned — this stack failing closed exactly as `Kern\Documents\Scanning\VirusScanner` intends —
# and a retry succeeds.
ConcurrentDatabaseReload no

# Room above the application's own upload ceiling, which clamd's compiled default did not leave.
#
# That default is 25M — 26214400 bytes, the same number as `DOCUMENTS_MAX_PDF_BYTES`. Equal passes,
# so nothing is broken today, but there is no margin: raising the application's limit by a single
# byte would make clamd refuse the stream, and a refused scan is not CLEAN, so the upload would be
# rejected with nothing in the error pointing here.
StreamMaxLength 32M
