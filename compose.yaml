# Kern — container topology (BLUEPRINT.md §3).
#
# This file holds the application and nothing else: the edge and the four PHP processes. Every
# service an installation may instead point at one it already runs lives in its own file under
# compose.services/, and `COMPOSE_FILE` in apps/api/.env chooses which of those are loaded.
#
# So this file on its own does NOT start a working stack — it has no database. That is deliberate:
# the alternative was `profiles:`, and a `depends_on` naming a service whose profile is inactive
# makes the whole project invalid ("depends on undefined service"), verified against compose 5.6.0.
# Splitting by file is the only shape where leaving a service out also leaves out everything that
# waits for it. See docs/INSTALLER-PLAN.md §3.
#
# `COMPOSE_FILE` also SUPPRESSES the automatic loading of compose.dev.yaml, so a development
# list has to name it explicitly, last. apps/api/.env.example carries the full line.
#
# This is the production-shape file: no host ports on postgres/redis,
# app_net and data_net are `internal: true` (no outbound Internet), and
# every image is pinned to an exact tag (docs/DEPENDENCY-POLICY.md).
# compose.dev.yaml adds dev-only conveniences (mailpit, published DB
# ports, bind-mounted source) on top of this file — do not add those things
# here.
#
# Network segmentation (see docs/handoff/001-docker-topology.md for the full
# matrix and the reasoning behind the extra `app`/`queue`/`scheduler` -> data_net
# attachments beyond BLUEPRINT.md §3.3's literal list; reverb left data_net on 2026-10-19):
#   edge_net        edge, app, reverb                              — not internal
#   app_net         app, queue, scheduler, reverb,          — internal
#                   redis, openbao
#   processing_net  app, python-api,                        — not internal
#                   clamav
#   data_net        postgres, redis, app, queue,            — internal
#                   scheduler
#   browser_net     app, browser-worker                     — not internal
#
# Networks stay declared here, all five, because every one of them has a member that is always
# present: app alone joins edge_net, app_net, processing_net, browser_net and data_net. A
# compose.services/ file only references them.
#
# Every image, here and in each Dockerfile, is pinned by exact tag and digest (docs/DEPENDENCY-POLICY.md
# §1): a tag is rebuilt upstream under the same name, and only the digest names the build that was
# tested. `make pins` reports a pin whose tag has moved on; moving it is a change like any other.

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
  processing_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
  browser_net:
    driver: bridge

# Only the volumes the four PHP processes need. Every other volume is declared in the
# compose.services/ file of the service that uses it, so leaving that file out of COMPOSE_FILE
# leaves nothing behind.
volumes:
  app_storage:
  app_bootstrap_cache:
  caddy_data:
  # php-fpm's socket, and nothing else. Mounted by `app` and `edge` only — see docker/php/www.conf.
  php_socket:
  # The stack's certificate authority (the `certs` service below). Its key, which nothing else mounts;
  # and its certificate, which every caller verifies a service against.
  tls_ca_key:
  tls_ca:
  # Each service's own key and certificate, which only that service and `certs` mount.
  tls_edge:
  tls_reverb:

x-php-image: &php-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
  # The one file this installation is configured in — see apps/api/.env.example. Every variable in
  # it is handed to app, queue and scheduler as a real environment variable (reverb takes a short list
  # of names instead — see that service), and Laravel prefers a real
  # environment variable over anything a `.env` inside the image might say.
  #
  # Deliberately the whole file rather than a list of names: this block used to enumerate sixty
  # variables, and a value set in the env file but not named here simply never arrived — a silent
  # failure that looked like the setting not working. It also meant compose.yaml held application
  # settings of its own, so the file an operator reads was not the file that decided anything.
  #
  # `python-api` and `browser-worker` do NOT get this file. They are on networks that carry no database
  # or object-storage credentials (BLUEPRINT.md §3.3), and handing them the whole environment would
  # undo that; each names the few variables it needs.
  env_file:
    - apps/api/.env
  # Not configuration — every one of these is already in the file above, and takes its value from it.
  # They are named again only so that an EMPTY one stops the stack, which is what `:?` does. Without
  # a key the application cannot encrypt; with an empty Reverb secret it would publish events under a
  # secret anyone can guess. A deployment that is missing one of these must fail to start, not start
  # and fail later. (The blind-index key is no longer one of them: it lives in the key manager.)
  environment:
    APP_NAME: ${APP_NAME:?set APP_NAME — see apps/api/.env.example}
    APP_KEY: ${APP_KEY:?set APP_KEY — see apps/api/.env.example}
    REVERB_APP_ID: ${REVERB_APP_ID:?set REVERB_APP_ID — see apps/api/.env.example}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY — see apps/api/.env.example}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?set REVERB_APP_SECRET — see apps/api/.env.example}
    # The database owner's credentials are in the file above, and the running application must not
    # have them: it connects as DB_USERNAME, a role that owns nothing (kern:db:grant-app-role), and
    # an owner's password in its environment would hand that back to anyone who reached it. Only
    # `migrate` below gets them.
    DB_OWNER_USERNAME: ""
    DB_OWNER_PASSWORD: ""
    # The list of certificates `certs` issued and when each ends, published beside its CA — the
    # `certificates` row of `kern:health`.
    TLS_STATUS_FILE: /run/kern/tls-ca/status
    # Reverb speaks TLS (the `reverb` service below), so an event is published over it, checked
    # against the stack's CA. Facts of this file, not settings: the service is always here.
    REVERB_SCHEME: https
    REVERB_CA_CERT: /run/kern/tls-ca/ca.crt
  volumes: &php-volumes
    - app_storage:/var/www/html/storage
    - app_bootstrap_cache:/var/www/html/bootstrap/cache
    # The stack's CA, which every connection to a service in it is verified against — see `certs`.
    - tls_ca:/run/kern/tls-ca:ro
    # And the CAs of services elsewhere that are signed by a private one, which the installer copies
    # here — OPENBAO_CA_CERT, AWS_CA_CERT, PROCESSING_CA_CERT and BROWSER_WORKER_CA_CERT name a file in it.
    - ./docker/tls/trusted:/run/kern/tls-trusted:ro
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  # -------------------------------------------------------------------------
  # Certificates — every internal service's, issued and renewed here
  # -------------------------------------------------------------------------
  # docker/certs/entrypoint.sh: one private CA, a certificate for each service that names itself in a
  # `KERN_CERT_<name>` variable — set by that service's own compose file, beside the volume it is
  # written into — and a daily check that renews whatever is near the end. Each service reloads its own
  # (docker/tls/kern-tls.sh), so nothing here needs the Docker socket.
  certs:
    build:
      context: docker/certs
    # On no network at all: it is reached through volumes, and reaches nothing.
    network_mode: none
    # Reaps nothing, but stops at once: a shell as PID 1 ignores the stop signal until its sleep ends.
    init: true
    environment:
      # The edge's certificate: the user it runs as (docker/caddy/Dockerfile) and every name it is
      # reached by — written by the installer, defaulting to this machine alone.
      KERN_CERT_edge: "10001:10001:${TLS_EDGE_NAMES:-localhost,127.0.0.1}"
      # Reverb's, for the `appuser` of the PHP image: the name the edge and the publishers connect to.
      KERN_CERT_reverb: "10001:10001:reverb,localhost,127.0.0.1"
      KERN_TLS_CA_DAYS: ${TLS_CA_DAYS:-3650}
      KERN_TLS_CERT_DAYS: ${TLS_CERT_DAYS:-365}
      KERN_TLS_RENEW_DAYS: ${TLS_RENEW_DAYS:-30}
      KERN_TLS_CHECK_SECONDS: ${TLS_CHECK_SECONDS:-86400}
    volumes:
      - tls_ca_key:/certs/ca
      - tls_ca:/certs/public
      - tls_edge:/certs/out/edge
      - tls_reverb:/certs/out/reverb
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # To hand each service its key: owned by the user that service runs as, readable by nobody else.
      - CHOWN
    healthcheck:
      # Written once every certificate has been issued, so a service that waits for this finds its own.
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Schema changes — run on purpose, never on start
  # -------------------------------------------------------------------------
  # `docker compose run --rm migrate` (`make migrate`, and the installer). Connects as the database's
  # owner, the one role that may create and alter tables; applies the migrations; brings each Postgres
  # extension up to the version its image ships; then creates or updates the application's own role and
  # grants it rows and nothing more. In the `tools` profile so
  # `up` never starts it: a schema change applied by a restart is one nobody decided to apply.
  migrate:
    <<: *php-image
    profiles: ["tools"]
    # The application's password goes to the role command on standard input, from the environment —
    # `printf` is a shell builtin, so it is on no command line. The shell sees the variable's name.
    command:
      - sh
      - -c
      - php artisan migrate --force && php artisan kern:db:update-extensions && printf '%s\n' "$$KERN_APP_DB_PASSWORD" | php artisan kern:db:grant-app-role --stdin "$$KERN_APP_DB_USERNAME"
    networks:
      - data_net
    environment:
      DB_USERNAME: ${DB_OWNER_USERNAME:?set DB_OWNER_USERNAME — see apps/api/.env.example}
      DB_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD — see apps/api/.env.example}
      KERN_APP_DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME — see apps/api/.env.example}
      KERN_APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD — see apps/api/.env.example}
    restart: "no"

  # -------------------------------------------------------------------------
  # Edge
  # -------------------------------------------------------------------------
  edge:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    ports:
      - "${EDGE_HTTP_PORT:-80}:8080"
      - "${EDGE_HTTPS_PORT:-443}:8443"
    # Which address this installation answers on, and how it proves it is that address. Both are
    # listed without a value on purpose: compose then passes each one through only when the
    # environment actually sets it, so the single place either default lives is the Caddyfile. A
    # default written here as well would be a second answer to the same question.
    environment:
      - KERN_EDGE_SITE
      - KERN_EDGE_TLS
      # And how ACME proves this name, for an installation behind a proxy that answers port 80
      # itself. Both empty unless the installer's fourth TLS answer was chosen; the Caddyfile's
      # global options explain why the whole directive is a variable rather than just the provider.
      - KERN_EDGE_ACME_DNS
      - KERN_EDGE_DNS_TOKEN
      # The HSTS header, whole, once the certificate is trusted — see the Caddyfile's header block.
      - KERN_EDGE_HSTS
      # Whose word to take for the visitor's address — Cloudflare's, behind its proxy, and nobody's
      # otherwise. See the Caddyfile's `servers` block.
      - KERN_EDGE_TRUSTED_PROXIES
      - KERN_EDGE_CLIENT_IP_HEADERS
    # Caddy reads a certificate from a file once, at start, and its admin API is off — so a renewed
    # one is picked up by exiting, and `restart` starting it again with the new one: a second or two,
    # once a year. `init` reaps the watcher (docker/tls/kern-tls.sh).
    init: true
    command: ["sh", "/usr/local/bin/kern-tls", "run", "TERM", "--", "caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      # TLS. The edge is published on a public IP, so plain HTTP would put the login password on the
      # wire in clear text. Its certificate is issued by `certs` for every name in TLS_EDGE_NAMES,
      # into a volume only the edge reads; a browser warns until this installation's CA is imported
      # (`make tls-ca`), or until a domain gets one from Let's Encrypt instead (KERN_EDGE_TLS).
      - tls_edge:/run/kern/tls:ro
      - ./docker/tls/kern-tls.sh:/usr/local/bin/kern-tls:ro
      # The stack's CA, which the edge checks Reverb's certificate against.
      - tls_ca:/run/kern/tls-ca:ro
      # A certificate of your own, for the installer's fourth TLS answer — copied here by the
      # installer, gitignored, and named by KERN_EDGE_TLS.
      - ./docker/caddy/certs:/etc/caddy/certs:ro
      # Caddy's TLS state: its own CA under `tls internal`, and the ACME account key and
      # certificates once a domain is configured. A named volume and not a tmpfs, because
      # re-issuing on every restart is how an installation reaches Let's Encrypt's rate limit.
      - caddy_data:/data
      # The only way in to php-fpm. Read-only is enough: connecting to a socket is not a write to
      # the filesystem it sits on.
      - php_socket:/run/php:ro
    networks:
      - edge_net
    depends_on:
      app:
        condition: service_healthy
      certs:
        condition: service_healthy
    read_only: true
    tmpfs:
      # Caddy's autosave directory. It stays empty while the admin API is off (see the Caddyfile),
      # but the process still creates it at boot, and mode 1777 because the container is not root.
      - /tmp:mode=1777
      - /config:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # busybox wget, which the alpine base already has — nothing is installed for this. curl was
      # the nginx image's answer and needed an apt-get.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Laravel — app / queue / scheduler / reverb (same image, four processes)
  # -------------------------------------------------------------------------
  app:
    <<: *php-image
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - tls_ca:/run/kern/tls-ca:ro
      - ./docker/tls/trusted:/run/kern/tls-trusted:ro
      # php-fpm's socket — the edge mounts the same volume. Listed here and not in the shared anchor,
      # because queue, scheduler and reverb run no php-fpm and have no business holding the way in.
      - php_socket:/run/php
    networks:
      - edge_net
      - app_net
      - processing_net
      - browser_net
      - data_net
    # A private AI endpoint — one on a VPN or a LAN — usually resolves only through the *host's*
    # /etc/hosts, which containers never read. The result is a provider that answers fine from a
    # terminal and is unreachable from the app, with nothing in the error to say why.
    #
    # Set both halves in apps/api/.env to publish that mapping inside the container. The default is
    # a deliberately unroutable placeholder, so leaving them unset changes nothing for anyone whose
    # provider has ordinary public DNS.
    extra_hosts:
      - "${AI_ENDPOINT_HOST:-ai-endpoint.invalid}:${AI_ENDPOINT_IP:-127.0.0.1}"
    healthcheck:
      # Proves php-fpm's socket accepts connections. It does NOT prove the pool answers a request —
      # see below for why there is nothing better here, and `/healthz` on the edge plus `make smoke`
      # for the checks that do exercise a real request.
      #
      # It used to run `cgi-fcgi -bind -connect 127.0.0.1:9000`, whose comment claimed it hit
      # `pm.status_path`. It did not: with no SCRIPT_NAME it asks php-fpm for nothing, and measured
      # on 2026-10-15 it failed 12 times out of 12 — as did `/fpm-ping` and `/fpm-status` with the
      # names set, because cgi-fcgi also wants a CGI stdin this never gave it. The container had
      # reported healthy for days only because it was created before that healthcheck existed;
      # Docker keeps the check a container was created with, so the first recreate turned a serving
      # php-fpm unhealthy and took the edge down with it (`depends_on: app: service_healthy`).
      #
      # Probed with php rather than /dev/tcp: this image's /bin/sh is dash and /dev/tcp is a bash
      # builtin — the same reason reverb's check is written this way, and the same trap that once
      # reported a listening Reverb as unhealthy.
      test: ["CMD", "php", "-r", "exit(@fsockopen('unix:///run/php/fpm.sock', -1, $$e, $$s, 3) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  queue:
    <<: *php-image
    command: ["php", "artisan", "horizon"]
    networks:
      - app_net
      - data_net
      # processing_net is required, not optional: ScanQuarantinedDocument reaches `clamav` and
      # ProcessScannedDocument reaches `python-api`, and BOTH run on this worker, not in `app`.
      # Without it every queued document silently fails its scan/extraction step even though the
      # same code works when exercised synchronously from `app` (which does have the network).
      - processing_net
    # A private AI endpoint — one on a VPN or a LAN — usually resolves only through the *host's*
    # /etc/hosts, which containers never read. The result is a provider that answers fine from a
    # terminal and is unreachable from the app, with nothing in the error to say why.
    #
    # Set both halves in apps/api/.env to publish that mapping inside the container. The default is
    # a deliberately unroutable placeholder, so leaving them unset changes nothing for anyone whose
    # provider has ordinary public DNS.
    extra_hosts:
      - "${AI_ENDPOINT_HOST:-ai-endpoint.invalid}:${AI_ENDPOINT_IP:-127.0.0.1}"
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          # Every Horizon worker shares this: the master, the default workers, the model worker and
          # the one reading laws — and one consolidation of the Codul fiscal is ~7.6 MB of HTML held
          # as a DOM. At 512M the kernel killed that worker mid-page (2026-09-22).
          memory: ${QUEUE_MEMORY_LIMIT:-2G}

  scheduler:
    <<: *php-image
    command: ["php", "artisan", "schedule:work"]
    networks:
      - app_net
      - data_net
    volumes:
      # Its own list replaces the shared one rather than adding to it — YAML merges keys, not the
      # lists under them — so the two writable volumes every PHP service needs are repeated here.
      # Without them the scheduler wrote into the image's read-only, root-owned `storage` and
      # `bootstrap/cache`, failed on every tick, and its heartbeat went silent.
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - tls_ca:/run/kern/tls-ca:ro
      - ./docker/tls/trusted:/run/kern/tls-trusted:ro
      - ./docker/php/scheduler-healthcheck.php:/usr/local/bin/scheduler-healthcheck.php:ro
    healthcheck:
      # Asserts the schedule *ran*, via a heartbeat file the schedule itself touches every minute
      # (see bootstrap/app.php). The previous check ran `pgrep`, which is not installed in this
      # image, so it failed from its first tick onward whatever the scheduler was doing — and a
      # process check could not have seen a scheduler that is alive but wedged anyway.
      test: ["CMD", "php", "/usr/local/bin/scheduler-healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Longer than the heartbeat's own cadence: the first tick has to happen before a missing
      # file can mean anything.
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  reverb:
    <<: *php-image
    # Not the whole environment file. Reverb is the one PHP process the internet reaches directly
    # (`handle /app/*` in the Caddyfile), and it holds a WebSocket open for anyone — so it is the one
    # where a bug matters most, and the one that needs least. It authenticates publishers with its own
    # secret and never decides who may listen (the app does that, on /broadcasting/auth), so it has no
    # use for the database, Redis, object storage, the AI keys or the internal service token. Before
    # this it held every one of them.
    #
    # Names only: each value still comes from apps/api/.env, which stays the one file a value is
    # written in (ADR 0017). A variable Reverb reads that is missing here falls back to its default in
    # config/reverb.php — `REVERB_SCALING_ENABLED` is off, which is what lets it run without Redis.
    env_file: []
    # TLS with the certificate `certs` issues it, behind the watcher that restarts it on a renewal:
    # Reverb reads its certificate once, at start, and the browsers it serves reconnect on their own.
    init: true
    command: ["sh", "/usr/local/bin/kern-tls", "run", "TERM", "--", "php", "artisan", "reverb:start"]
    environment:
      - REVERB_TLS_CERT=/run/kern/tls/server.crt
      - REVERB_TLS_KEY=/run/kern/tls/server.key
      - APP_NAME
      - APP_ENV
      - APP_DEBUG
      # The fallback for REVERB_ALLOWED_ORIGINS in config/reverb.php.
      - APP_URL
      - LOG_CHANNEL
      - LOG_STACK
      - LOG_LEVEL
      - REVERB_APP_ID
      - REVERB_APP_KEY
      - REVERB_APP_SECRET
      - REVERB_HOST
      - REVERB_PORT
      - REVERB_SCHEME
      - REVERB_SERVER_HOST
      - REVERB_SERVER_PORT
      - REVERB_ALLOWED_ORIGINS
      - REVERB_SCALING_ENABLED
      # Boot reads stored settings from the cache and then the database, and gives up quietly when it
      # cannot reach them. An in-process cache keeps that from being a Redis connection attempt.
      - CACHE_STORE=array
    # Its own list, which replaces the shared one: its key and certificate and the watcher, beside the
    # two writable volumes every PHP process needs. Not the stack's CA, which it never checks anything
    # against.
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - tls_reverb:/run/kern/tls:ro
      - ./docker/tls/kern-tls.sh:/usr/local/bin/kern-tls:ro
    depends_on:
      certs:
        condition: service_healthy
    networks:
      # edge_net so the edge can proxy the browser's WebSocket handshake to it (see
      # docker/caddy/Caddyfile, `handle /app/*`). Without this the edge cannot resolve
      # `reverb` at all and every client falls back to no live updates, silently.
      - edge_net
      # app_net so `app` and `queue` can publish to it. Not data_net: it holds no credential for
      # anything there, and a network it has no use for is only a route for whoever takes it over.
      - app_net
    healthcheck:
      # Reverb exposes no documented HTTP health route as of this check
      # (2026-09-07) — this only proves the WebSocket port accepts TCP
      # connections. See "What is NOT done".
      # Probed with php, not /dev/tcp: this image's /bin/sh is dash, and /dev/tcp is a bash
      # builtin — so the old CMD-SHELL check could never succeed and reported a healthy,
      # listening Reverb as unhealthy, which blocks any depends_on: service_healthy on it.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080, $$e, $$s, 3) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M






